name: Process live note source request

on:
  repository_dispatch:
    types: [source-conversion-request]
  workflow_dispatch:
    inputs:
      source_id:
        description: Source adapter ID
        required: true
        type: choice
        options: [notalar, gitaregitim, songsterr, academic-pdf]
      post_id:
        description: WordPress post ID
        required: false
        type: string
      song_id:
        description: Songsterr song ID
        required: false
        type: string
      track_index:
        description: Preferred melodic track index
        required: false
        type: string
      document_id:
        description: Curated document ID
        required: false
        type: string
      query:
        description: Original song search
        required: false
        type: string
      title:
        description: Source result title
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: live-note-source-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUEST_ID: ${{ github.event.client_payload.requestId }}
      SOURCE_ID: ${{ github.event.client_payload.sourceId || inputs.source_id }}
      POST_ID: ${{ github.event.client_payload.postId || inputs.post_id }}
      SONG_ID: ${{ github.event.client_payload.songId || inputs.song_id }}
      TRACK_INDEX: ${{ github.event.client_payload.trackIndex || inputs.track_index }}
      DOCUMENT_ID: ${{ github.event.client_payload.documentId || inputs.document_id }}
      SOURCE_QUERY: ${{ github.event.client_payload.query || inputs.query }}
      SOURCE_TITLE: ${{ github.event.client_payload.title || inputs.title }}
      SOURCE_ARTIST: ${{ github.event.client_payload.artist }}
      SOURCE_BPM: ${{ github.event.client_payload.tempo.bpm }}
      SOURCE_BPM_PROVIDER: ${{ github.event.client_payload.tempo.provider }}
      SOURCE_BPM_URL: ${{ github.event.client_payload.tempo.sourceUrl }}
      SOURCE_BPM_CONFIDENCE: ${{ github.event.client_payload.tempo.confidence }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install score importer
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Prepare source request
        id: prepare
        run: node scripts/process-source-job.mjs prepare

      - name: Extract Audiveris 5.11
        if: steps.prepare.outputs.mode == 'omr' || steps.prepare.outputs.mode == 'pdf-pages'
        run: |
          curl --fail --location --output audiveris.deb https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-ubuntu24.04-x86_64.deb
          echo "f20113aaa33b3149ec8d6a09b2a7963360e65fafd92d69389987a85bbc3ec7a3  audiveris.deb" | sha256sum --check
          mkdir -p .source-job/audiveris
          dpkg-deb --extract audiveris.deb .source-job/audiveris
          test -x .source-job/audiveris/opt/audiveris/bin/Audiveris

      - name: Render selected PDF pages
        if: steps.prepare.outputs.mode == 'pdf-pages'
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p .source-job/input
          pdftoppm \
            -f "${{ steps.prepare.outputs.page_start }}" \
            -l "${{ steps.prepare.outputs.page_end }}" \
            -r 300 \
            -png \
            .source-job/document.pdf \
            .source-job/input/page
          find .source-job/input -type f -name '*.png' -print -quit | grep -q .

      - name: Read score images and PDFs
        if: steps.prepare.outputs.mode == 'omr' || steps.prepare.outputs.mode == 'pdf-pages'
        continue-on-error: true
        run: |
          mkdir -p .source-job/omr
          AUDIVERIS_BIN="$GITHUB_WORKSPACE/.source-job/audiveris/opt/audiveris/bin/Audiveris"
          test -x "$AUDIVERIS_BIN"
          for input in .source-job/input/*; do
            "$AUDIVERIS_BIN" -batch -export -output .source-job/omr "$input"
          done
          find .source-job/omr -type f -name '*.mxl' -print0 | while IFS= read -r -d '' archive; do
            mkdir -p "${archive}.unpacked"
            unzip -o "$archive" -d "${archive}.unpacked"
          done

      - name: Finalize machine-read score
        if: always() && (steps.prepare.outputs.mode == 'omr' || steps.prepare.outputs.mode == 'pdf-pages')
        run: node scripts/process-source-job.mjs finalize

      - name: Audit catalog structure and quality
        run: npm run audit:catalog

      - name: Commit result and catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json catalog/jobs
          if git diff --cached --quiet; then
            echo "No result files changed"
            exit 0
          fi
          git commit -m "Process live note source request"
          git pull --rebase origin main
          git push origin HEAD:main
